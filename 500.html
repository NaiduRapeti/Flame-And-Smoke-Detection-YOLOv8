{% extends "base.html" %}

{% block title %}Server Error - Fire & Smoke Detection{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <div class="error-content">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                    </div>
                    <h1 class="display-4 fw-bold mb-3">500</h1>
                    <h2 class="mb-4">Server Error</h2>
                    <p class="lead text-muted mb-4">Oops! Something went wrong on our end. Our team has been notified and we're working to fix it.</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{{ url_for('home') }}" class="btn btn-primary">
                            <i class="bi bi-house-door me-2"></i>Back to Home
                        </a>
                        <a href="{{ url_for('detect') }}" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-clockwise me-2"></i>Try Again
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .error-content {
        padding: 4rem 0;
    }
    
    .display-4 {
        font-size: 4rem;
        line-height: 1;
        margin-bottom: 1.5rem;
    }
    
    @media (max-width: 768px) {
        .display-4 {
            font-size: 3rem;
        }
    }
</style>
{% endblock %}
