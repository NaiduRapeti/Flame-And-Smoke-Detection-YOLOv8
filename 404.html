{% extends "base.html" %}

{% block title %}Page Not Found - Fire & Smoke Detection{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <div class="error-content">
                    <h1 class="display-1 fw-bold text-primary">404</h1>
                    <h2 class="mb-4">Page Not Found</h2>
                    <p class="lead text-muted mb-4">Oops! The page you are looking for doesn't exist or has been moved.</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{{ url_for('home') }}" class="btn btn-primary">
                            <i class="bi bi-house-door me-2"></i>Back to Home
                        </a>
                        <a href="{{ url_for('detect') }}" class="btn btn-outline-primary">
                            <i class="bi bi-camera-video me-2"></i>Try Detection
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .error-content {
        padding: 4rem 0;
    }
    
    .display-1 {
        font-size: 8rem;
        line-height: 1;
        margin-bottom: 1.5rem;
    }
    
    @media (max-width: 768px) {
        .display-1 {
            font-size: 6rem;
        }
    }
</style>
{% endblock %}
